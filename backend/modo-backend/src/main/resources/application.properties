spring.application.name=modo-backend

# Database configuration 

spring.datasource.url=jdbc:postgresql://172.18.187.50:5432/modo_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=modo_user
spring.datasource.password=modo_dev_password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA and Hibernate configuration ( dev )
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port 

server.port=8080 

# Docker Compose configuration 
spring.docker.compose.enabled=false

spring.docker.compose.lifecycle-management=start-and-stop

# --- Spring Boot Actuator / Prometheus metrics ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=modo-backend
management.metrics.enable.hibernate=true
management.metrics.enable.jdbc=true
management.metrics.enable.tomcat=true
management.metrics.enable.process=true
spring.datasource.hikari.register-mbeans=true
server.servlet.register-default-servlet=true