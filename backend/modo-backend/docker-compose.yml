services:
  postgres:
    image: postgres:17-alpine
    container_name: modo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: modo_db
      POSTGRES_USER: modo_user
      POSTGRES_PASSWORD: modo_dev_password

    ports:
      - "5432:5432"

    volumes:
      - modo_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modo_user -d modo_db"]
      interval: 5s
      timeout: 5s
      retries: 10


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: modo-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: hassine@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    volumes:
      - modo_pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

  modo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modo-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/modo_db
      SPRING_DATASOURCE_USERNAME: modo_user
      SPRING_DATASOURCE_PASSWORD: modo_dev_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    depends_on:
      postgres:
        condition: service_healthy
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: modo-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_URI: postgres:5432/modo_db?sslmode=disable
      DATA_SOURCE_USER: modo_user
      DATA_SOURCE_PASS: modo_dev_password

    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: modo-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      - postgres-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: modo-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/datasources/dashboards:/etc/grafana/provisioning/dashboards:ro

    depends_on:
      - prometheus

volumes:
  modo_postgres_data:
  modo_pgadmin_data:
  prometheus_data:
  grafana_data: